function fieldHTML(f,val=''){return `<label class="field">${labels[f]}<input class="answer" name="${f}" aria-label="${labels[f]}" lang="en" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="text" value="${esc(val||'')}" placeholder="영어로 써 봐"></label>`;}
function saveInputs(){if(!session)return;let s=qs();s.values??={};$$('input.answer').forEach(x=>s.values[x.name]=x.value);}
function choiceOptions(v,f){let correct=answers(v,f),bad=[v.base,...v.past,...v.pp,v.base+'ed',v.base+'en',...VERBS.flatMap(x=>x[f]||[])];let opts=[correct[0],...shuffle([...new Set(bad)].filter(x=>!correct.includes(x))).slice(0,3)];return shuffle(opts);}
function meaningOptions(v){const confusing=VERBS.filter(x=>x.base===v.base||(['wind','wound'].includes(v.base)&&['wind','wound'].includes(x.base))).map(x=>x.meaning);return shuffle([v.meaning,...[...new Set([...confusing,...shuffle(VERBS).map(x=>x.meaning)])].filter(m=>m!==v.meaning).slice(0,3)]);}
function renderTiles(){let s=qs();$('#tile-word').textContent=s.used.map(i=>s.tiles[i]).join('')||'…';$$('[data-tile]').forEach(b=>b.disabled=s.used.includes(Number(b.dataset.tile)));}
function renderMatches(){let s=qs();$$('[data-left]').forEach(b=>{b.classList.toggle('selected',s.left===b.dataset.left);b.classList.toggle('matched',s.pairs.includes(b.dataset.left));b.disabled=s.pairs.includes(b.dataset.left);});$$('[data-right]').forEach(b=>{b.classList.toggle('matched',s.pairs.includes(b.dataset.right));b.disabled=s.pairs.includes(b.dataset.right);});$('#match-status').textContent=`${s.pairs.length} / 3 연결했어!`;requestAnimationFrame(drawLines);}
function drawLines(){if(!$('.match-lines')||!session)return;const box=$('.match-grid').getBoundingClientRect();$('.match-lines').innerHTML=qs().pairs.map(id=>{let a=$(`[data-left="${id}"]`).getBoundingClientRect(),b=$(`[data-right="${id}"]`).getBoundingClientRect();return `<line x1="${a.right-box.left}" y1="${a.top+a.height/2-box.top}" x2="${b.left-box.left}" y2="${b.top+b.height/2-box.top}" stroke="#84ae59" stroke-width="3"/>`;}).join('');}
window.addEventListener('resize',drawLines);
function matchRight(id){let s=qs();if(s.done)return;if(!s.left){toast('먼저 왼쪽 동사를 골라 줘.');return;}if(id===s.left){s.pairs.push(id);s.left=null;renderMatches();sound(true);if(s.pairs.length===3)complete(s.matchErrors===0,`${s.matchErrors}번 다시 연결`);}else{s.matchErrors++;sound(false);toast('이 짝은 달라. 원형과 뜻을 다시 살펴봐!');let b=$(`[data-right="${id}"]`);b.classList.add('error');setTimeout(()=>b.classList.remove('error'),500);}saveSession();}
function setupCanvas(f){const c=$('#canvas-'+f),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;let r=c.getBoundingClientRect();c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);ctx.scale(dpr,dpr);ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#183b38';let drawing=false;qs().drawings??={};if(qs().drawings[f]){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=qs().drawings[f];}function pt(e){const b=c.getBoundingClientRect();return [(e.clientX-b.left)*r.width/b.width,(e.clientY-b.top)*r.height/b.height];}c.onpointerdown=e=>{if(qs().done)return;e.preventDefault();c.setPointerCapture(e.pointerId);drawing=true;ctx.beginPath();ctx.moveTo(...pt(e));ctx.lineTo(...pt(e));ctx.stroke();qs().ink??={};qs().ink[f]=true;};c.onpointermove=e=>{if(!drawing)return;ctx.lineTo(...pt(e));ctx.stroke();};const stop=()=>{if(!drawing)return;drawing=false;qs().drawings[f]=c.toDataURL();saveSession();};c.onpointerup=stop;c.onpointercancel=stop;$(`[data-erase="${f}"]`).onclick=()=>{ctx.clearRect(0,0,r.width,r.height);qs().ink??={};qs().ink[f]=false;delete qs().drawings[f];saveSession();};}
function revealHand(){const s=qs(),v=VERBS[current().id];if(!s.handRevealed&&(!s.ink?.past||!s.ink?.pp)){toast('두 칸에 모두 써 봐. 마우스로도 쓸 수 있어!');return;}s.handRevealed=true;s.hinted=true;s.fields=['past','pp'];$('#hint-box').innerHTML=`<div class="hint"><strong>내 글씨와 한 글자씩 비교해 봐.</strong><div class="answer-line">${v.past.join(' / ')} → ${v.pp.join(' / ')}</div><p>틀린 부분을 고쳐 보고, 아래에 정확한 철자를 입력해 줘.</p><div class="fields">${fieldHTML('past',s.values?.past)}${fieldHTML('pp',s.values?.pp)}</div></div>`;$('#actions').innerHTML='<div class="action-row"><span class="muted">손글씨는 연습 기록으로 남아요.</span><button class="btn primary" id="hand-check">비교하고 스펠링 확인</button></div>';$('#hand-check').onclick=()=>{saveInputs();let ok=['past','pp'].every(f=>accept(v,f,s.values[f]));if(!ok){toast('정답을 보며 철자를 한 번 더 확인해 줘.');return;}complete(true,`손글씨 비교 · ${s.values.past} / ${s.values.pp}`);};$$('input.answer').forEach(x=>x.oninput=()=>{saveInputs();saveSession();});saveSession();}
function showHint(){let q=current(),v=VERBS[q.id],fields=qs().fields||[q.field];$('#hint-box').innerHTML=`<div class="hint">${fields.map(f=>`${labels[f]}: <strong>${answers(v,f)[0][0]}${'＿'.repeat(answers(v,f)[0].length-1)}</strong> (${answers(v,f)[0].length}글자)`).join(' · ')}<br>힌트를 쓴 문제는 연습으로 기록돼요.</div>`;}
function hint(){saveInputs();qs().hinted=true;showHint();saveSession();}
function check(){let q=current(),v=VERBS[q.id],s=qs();if(s.done)return;saveInputs();let ok=false,user='';if(['pair','all','missing','challenge'].includes(q.type)){if(s.fields.some(f=>!norm(s.values?.[f]||''))){toast('빈칸을 모두 채워 줘.');return;}ok=s.fields.every(f=>accept(v,f,s.values[f]));user=s.fields.map(f=>`${labels[f]}: ${s.values[f]}`).join(' · ');}else if(q.type==='choice'||q.type==='meaning'){if(s.selected===undefined){toast('답을 하나 골라 줘.');return;}user=s.options[s.selected];ok=q.type==='meaning'?user===v.meaning:accept(v,q.field,user);}else if(q.type==='tiles'){user=s.used.map(i=>s.tiles[i]).join('');if(!user){toast('글자 조각을 눌러 단어를 만들어 줘.');return;}ok=accept(v,q.field,user);}complete(ok,user);}
function record(v,ok,typed){let t={...stat(v)};t.seen++;if(ok){t.correct++;if(typed){t.typed++;t.miss=0;}}else{t.miss++;t.typed=0;}state.stats[v.id]=t;}
function complete(ok,user){let s=qs();if(s.done)return;s.done=true;s.lastOK=ok;s.lastUser=user;let q=current(),v=VERBS[q.id],typed=ok&&!s.hinted&&['pair','all','challenge'].includes(q.type);record(v,ok,typed);
if(q.type==='match')s.matchIds.filter(id=>id!==v.id).forEach(id=>record(VERBS[id],ok,false));
if(!state.days.includes(today()))state.days.push(today());session.combo=ok?session.combo+1:0;session.maxCombo=Math.max(session.maxCombo,session.combo);let xp=ok?(s.hinted?5:typed?15:10):2;session.xp+=xp;state.xp+=xp;
session.results.push({id:q.id,type:q.type,ok,user,hinted:!!s.hinted,typed});
if(!ok&&!isExam()&&!session.repeatIds.includes(v.id)){session.repeatIds.push(v.id);session.queue.splice(Math.min(session.pos+4,session.queue.length),0,makeQ(v,'pair'));}
save();updateHeader();saveSession();if(isExam()){next();return;}sound(ok);showFeedback(ok,user);}
function showFeedback(ok,user,restored=false){let v=VERBS[current().id],s=qs();$$('#question input,#question button').forEach(x=>x.disabled=true);$('#actions').innerHTML='';if(current().type==='hand')$$('#hint-box input').forEach(x=>x.disabled=true);
$('#feedback').innerHTML=`<div class="feedback ${ok?'confetti':'bad'}"><h3>${ok?(s.hinted?'잘 연습했어! 다음에는 혼자 써 보자.':session.combo>=3?`${session.combo}연속 정답! 멋지게 연결 중 ✦`:'정답! 한 걸음 더 가까워졌어 ✦'):'괜찮아! 지금 기억하면 돼.'}</h3>${!ok?`<p>내 답: ${esc(user)}</p>`:''}<div class="answer-line" lang="en">${forms(v)}</div><p>${v.meaning}</p><p>${v.tip||groupTip(v)}</p>${!ok?'<p>조금 뒤에 이 동사를 다시 만나게 돼.</p>':''}<button class="btn ${ok?'primary':'lime'}" id="next">${session.pos+1>=session.queue.length?'탐험 결과 보기':'다음 미션 →'}</button></div>`;$('#next').onclick=next;}
function groupTip(v){return {AAA:'세 형태의 철자가 모두 같아요.',ABA:'원형과 과거분사는 같고, 과거형만 달라요.',ABB:'과거형과 과거분사는 같은 모양이에요.',ABC:'원형 → 과거형 → 과거분사, 순서대로 소리 내어 읽어 봐요.',SPECIAL:'같은 철자여도 뜻에 따라 변하는 모양이 달라져요.'}[v.group];}
function next(){session.pos++;session.qstate={};saveSession();if(session.pos>=session.queue.length)finish();else renderQuestion();}
function finish(){screen='result';let s=session;if(!s)return;let right=s.results.filter(r=>r.ok).length,score=Math.round(right/s.results.length*100),wrong=[...new Set(s.results.filter(r=>!r.ok).map(r=>r.id))];if(!s.finished){state.sessions++;if(isExam()){state.best=Math.max(state.best||0,score);state.examHistory.unshift({date:today(),score,mode:s.mode});state.examHistory=state.examHistory.slice(0,20);}s.finished=true;save();try{localStorage.removeItem(KEY+'-session');}catch(e){}}
mount(`<div class="game-wrap"><section class="quest-card session-result"><div class="result-icon">${score===100?'♛':'⚑'}</div><div class="eyebrow">${isExam()?'실전 결과':'오늘의 탐험 완료'}</div><h1 style="font-size:32px">${score===100?'완벽한 한 바퀴!':'오늘도 실력이 자랐어!'}</h1><div class="result-score">${isExam()?`${score}<span>점</span>`:`+${s.xp}<span> XP</span>`}</div><p class="muted">${isExam()?`${s.results.length}문제 중 ${right}문제 정답 · 두 칸 모두 맞으면 정답`:'직접 쓰기로 확인한 동사가 진짜 내 실력이 돼요.'}</p><div class="result-grid"><div><strong>${right}/${s.results.length}</strong><small>맞힌 미션</small></div><div><strong>${s.results.filter(r=>r.typed).length}</strong><small>힌트 없이 직접 쓰기</small></div><div><strong>${s.maxCombo}</strong><small>최고 연속 정답</small></div></div><div class="hero-actions" style="justify-content:center">${wrong.length?'<button class="btn lime" id="retry">틀린 동사 다시 도전 ↻</button>':''}<button class="btn primary" id="again">새 탐험 시작</button><button class="btn secondary" id="go-home">홈으로</button></div>${wrong.length?`<div class="review-list"><h3>다시 만나면 더 잘할 수 있어</h3>${wrong.map(id=>{let v=VERBS[id],r=s.results.find(r=>r.id===id&&!r.ok);return `<div class="review-item"><strong>${forms(v)}</strong><p>${v.meaning}</p><p>내 답: ${esc(r.user)}</p><p>${v.tip||groupTip(v)}</p></div>`;}).join('')}</div>`:'<div class="tip-strip">다음에는 다른 동사들도 만나 봐! 프린트 전체 점검에서 빠진 단어가 없는지 확인할 수 있어.</div>'}<details style="text-align:left;margin-top:25px"><summary>모든 문제와 정답 확인</summary><div class="review-list">${s.results.map((r,i)=>`<div class="review-item">${i+1}. ${r.ok?'✓':'↻'} <strong>${forms(VERBS[r.id])}</strong><p>${VERBS[r.id].meaning}</p><p>내 답: ${esc(r.user)}${r.hinted?' · 힌트/손글씨 연습':''}</p></div>`).join('')}</div></details></section></div>`);if($('#retry'))$('#retry').onclick=()=>start('weak',wrong);$('#again').onclick=()=>start('adventure');$('#go-home').onclick=home;}
function book(){screen='book';mount(`<div class="section-head"><div><div class="eyebrow">MY VERB COLLECTION</div><h1 style="font-size:34px;margin-bottom:8px">나의 동사 도감</h1><p class="muted">프린트의 모든 86개 항목. 같은 동사도 뜻이 다르면 따로 공부해요.</p></div><button class="btn secondary" id="go-home">← 홈으로</button></div><div class="subnav"><button class="btn secondary" id="print">인쇄하기</button><button class="btn secondary" id="export">학습 기록 백업</button><button class="btn secondary" id="import">기록 가져오기</button><input id="import-file" type="file" accept="application/json" hidden></div><div class="book-toolbar"><input type="search" id="search" placeholder="영어 또는 우리말 뜻 찾기" aria-label="동사 검색"><select id="book-range" aria-label="동사 유형">${rangeOptions(bookFilter)}</select><select id="status-filter" aria-label="학습 상태"><option value="all">모든 동사</option><option value="weak">다시 연습할 동사</option><option value="new">아직 안 만난 동사</option><option value="master">직접 쓰기 2회 성공</option></select></div><div class="muted" id="book-count" style="margin-bottom:10px"></div><div class="table-wrap"><table><thead><tr><th>원형</th><th>과거형</th><th>과거분사</th><th>뜻 / 기억할 점</th><th>내 기록</th></tr></thead><tbody id="book-body"></tbody></table></div><div class="tip-strip">프린트 기준으로 학습해요. 괄호로 함께 제시된 bit/bitten, forgot/forgotten, got/gotten은 둘 다 정답이에요. do(does)는 원형 do를 입력해요. read는 철자는 같지만 발음이 달라요.<br>‘직접 쓰기 2회 성공’은 원형과 뜻 또는 뜻만 보고, 과거형·과거분사를 힌트 없이 모두 쓴 횟수예요. 고르기·짝잇기·손글씨는 연습 기록에만 반영해요.</div><div style="margin-top:20px"><button class="text-btn" id="reset">학습 기록 초기화</button><div id="reset-box"></div></div>`);$('#go-home').onclick=home;$('#print').onclick=()=>window.print();$('#search').oninput=renderBook;$('#book-range').onchange=e=>{bookFilter=e.target.value;renderBook();};$('#status-filter').onchange=renderBook;$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`동사섬-학습기록-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('#import').onclick=()=>$('#import-file').click();$('#import-file').onchange=importRecord;$('#reset').onclick=()=>{$('#reset-box').innerHTML='<div class="confirm-box">이 기기의 점수와 학습 기록이 지워져요. 먼저 백업할 수 있어요.<div class="hero-actions"><button class="btn secondary" id="cancel-reset">취소</button><button class="btn primary" id="confirm-reset">기록 모두 지우기</button></div></div>';$('#cancel-reset').onclick=()=>$('#reset-box').innerHTML='';$('#confirm-reset').onclick=()=>{state=fresh();save();try{localStorage.removeItem(KEY+'-session');}catch(e){}home();toast('기록을 초기화했어요.');};};renderBook();}
function renderBook(){let term=norm($('#search').value),sf=$('#status-filter').value,list=VERBS.filter(v=>(bookFilter==='ALL'||v.group===bookFilter)&&(`${forms(v)} ${v.meaning}`.toLowerCase().includes(term))&&(sf==='all'||sf==='weak'&&weak(v)||sf==='new'&&!stat(v).seen||sf==='master'&&mastered(v)));$('#book-count').textContent=`${list.length}개 항목`;$('#book-body').innerHTML=list.map(v=>`<tr><td><strong>${v.base}</strong></td><td>${v.past.join(' / ')}</td><td>${v.pp.join(' / ')}</td><td>${v.meaning}${v.tip?`<span class="subtip">${v.tip}</span>`:''}</td><td><span class="status-dot ${mastered(v)?'master':weak(v)?'weak':''}">${mastered(v)?'✦ 직접 쓰기 성공':weak(v)?'↻ 다시 연습':stat(v).seen?'연습 중':'아직 안 만남'}</span><span class="subtip">혼자 쓰기 ${stat(v).typed}회</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">조건에 맞는 동사가 없어요.</td></tr>';}
async function importRecord(e){let f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error();let data=JSON.parse(await f.text());if(data.version!==1||!data.state||!data.state.stats||!Array.isArray(data.state.days)||!Number.isFinite(data.state.xp))throw Error();let safe=fresh();safe.xp=Math.max(0,Math.floor(data.state.xp));safe.sessions=Math.max(0,Number(data.state.sessions)||0);safe.days=data.state.days.filter(x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x));safe.best=data.state.best===null?null:Math.max(0,Math.min(100,Number(data.state.best)||0));for(const v of VERBS){const t=data.state.stats[v.id];if(t)safe.stats[v.id]=Object.fromEntries(['seen','correct','typed','miss','due'].map(k=>[k,Math.max(0,Number(t[k])||0)]));}$('#reset-box').innerHTML='<div class="confirm-box">백업 기록으로 현재 기록을 바꿀까요?<div class="hero-actions"><button class="btn primary" id="confirm-import">가져오기</button><button class="btn secondary" id="cancel-import">취소</button></div></div>';$('#confirm-import').onclick=()=>{state=safe;save();try{localStorage.removeItem(KEY+'-session');}catch(e){}book();toast('학습 기록을 가져왔어요.');};$('#cancel-import').onclick=()=>$('#reset-box').innerHTML='';$('#reset-box').scrollIntoView({behavior:'smooth'});}catch(e){toast('올바른 동사섬 백업 파일인지 확인해 주세요.');}}
$('#brand').onclick=e=>{e.preventDefault();if(screen==='game'){saveInputs();saveSession();}home();};$('#sound').onclick=()=>{state.sound=!state.sound;save();updateHeader();sound(true);};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#next')&&!e.target.matches('input,button')){e.preventDefault();next();}});
window.addEventListener('beforeunload',()=>{if(screen==='game'){saveInputs();saveSession();}});
home();
</script></body></html>
